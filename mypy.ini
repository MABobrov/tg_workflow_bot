# Тайпчекер mypy. Заведён 06.09.2026 (этап B защитной сетки, HEAD e71de87).
#
# БАЗОВАЯ ЛИНИЯ на момент заведения: 478 ошибок в 39 файлах из 65 проверенных.
#   218 arg-type    90 union-attr   62 index      37 assignment  14 operator
#    10 misc         9 name-defined  8 call-overload 7 truthy-function
#     6 no-redef     6 attr-defined  4 call-arg   3 return-value 3 override
# Топ файлов: db.py 108, handlers/tasks.py 61, handlers/common.py 58,
#             handlers/admin.py 47, handlers/gd.py 32, utils.py 25.
#
# ⚠️ Смысл — порог «не хуже», а не чистота. В коде 1308 "# type: ignore"
# (1150 из них [union-attr]) — их массовая вычистка НЕ входит в этап B.
#
# Проверка классов с высоким сигналом сделана 06.09: все оказались ЛОЖНЫМИ,
# кроме одного. Разбор, чтобы следующая сессия не искала заново:
#   operator (float - None, utils.py:1034-1052)  — ложь: перед вычитанием стоит
#       isinstance-гард, mypy не сужает тип через двойной .get().
#   operator (object + float, sheets.py:3493)    — ложь: разнородный dict-литерал
#       выводится как dict[str, object]; то же у rp_start_card.py:430 (_OKLAD_CACHE).
#   call-arg "Too few arguments" (4 шт)          — ложь: это @router.*.outer_middleware(),
#       mypy не знает протокол миддлвари aiogram.
#   truthy-function (7 шт, ZoneInfo)             — ложь: проверяется не функция,
#       а результат импорта в try/except.
#   no-redef (6 шт) — из них РЕАЛЬНЫЙ один: db.py:9881 get_manager_advance_for_invoice
#       поверх db.py:3297 (дефект №1 реестра). Остальные — переаннотация локальной
#       переменной в соседней ветке (cells в sheets.py, rows в keyboards.py) и
#       мёртвый дубль _fmt_rub в gd.py:2310 (перекрыт версией на :4407,
#       формат совпадает — мёртвый код, не расхождение показа).
#
# ignore_missing_imports=True обязателен: стабов для aiogram/gspread/minio в
# окружении нет, без него счёт утонет в шуме "library stubs not installed".

[mypy]
python_version = 3.11
ignore_missing_imports = True
show_error_codes = True
warn_unused_ignores = False
warn_redundant_casts = True
