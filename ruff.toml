# Линтер ruff. Заведён 06.09.2026 (этап B защитной сетки, HEAD e71de87).
#
# БАЗОВАЯ ЛИНИЯ на момент заведения: 100 нарушений в app/.
#   34 F541 f-string без подстановок      23 F841 неиспользуемая переменная
#   14 F401 неиспользуемый импорт         11 E702 два выражения через ; в строке
#    9 F821 неопределённое имя             6 E741 неоднозначное имя переменной
#    2 F811 переопределение                1 E731 lambda вместо def
#
# ⚠️ Смысл прогона — НЕ «ноль нарушений», а порог «не хуже»: правка не должна
# добавлять новых. Массовая вычистка — отдельное решение owner'а, она трогает
# 100 мест в коде, который сейчас работает.
#
# Разбор двух «страшных» классов сделан 06.09 и дал НЕ баги:
#   F821 (9 шт: Any в gd.py, Notifier в utils.py) — в обоих файлах стоит
#        "from __future__ import annotations", аннотации не вычисляются в рантайме.
#        Чинится импортом, на поведение не влияет.
#   F811 (2 шт) — lead_cancel в rp_new.py безвреден (фильтры разные, aiogram
#        регистрирует оба хендлера в момент декорирования); а вот
#        get_manager_advance_for_invoice (db.py:9881 поверх db.py:3297) — это
#        подтверждение уже известного дефекта №1 из реестра этапа C.
#
# Расширять select — только отдельным решением: каждое новое правило поднимает
# базовую линию и требует пересъёма порога.

target-version = "py311"
line-length = 120

[lint]
# Дефолтный набор ruff: E4 (импорты), E7 (выражения), E9 (синтаксис), F (pyflakes).
select = ["E4", "E7", "E9", "F"]
